<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Cheat Sheet - Complete Edition</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  scroll-behavior:smooth;
  font-family:Arial,sans-serif;
}

:root{
  --bg:#101624;
  --panel:#171f2f;
  --panel-soft:#202a3d;
  --border:#324158;
  --text:#f8fafc;
  --muted:#cbd5e1;
  --blue:#38bdf8;
  --green:#34d399;
  --amber:#fbbf24;
  --rose:#fb7185;
}

body{
  background:linear-gradient(135deg,#101624,#172033 55%,#141827);
  color:var(--text);
  overflow-x:hidden;
}

.topbar{
  height:70px;
  background:#121a29;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 20px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:1000;
}

.menu-btn{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:8px;
  background:transparent;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.menu-btn:hover{
  background:var(--panel-soft);
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:var(--blue);
  white-space:nowrap;
}

.language-scroll{
  display:flex;
  gap:10px;
  overflow-x:auto;
  flex:1;
  justify-content:flex-end;
}

.lang-btn{
  min-width:82px;
  padding:9px 16px;
  border:1px solid transparent;
  border-radius:8px;
  background:var(--panel-soft);
  color:white;
  cursor:pointer;
  font-weight:700;
}

.lang-btn:hover{
  border-color:var(--blue);
}

.lang-btn.active{
  background:var(--blue);
  color:#06111d;
}

.container{
  display:flex;
  min-height:calc(100vh - 70px);
}

.sidebar{
  width:310px;
  flex:0 0 310px;
  background:#121a29;
  border-right:1px solid var(--border);
  padding:22px;
  overflow-y:auto;
  transition:.3s;
}

.sidebar.hide{
  margin-left:-310px;
}

.sidebar-title{
  font-size:23px;
  margin-bottom:18px;
  color:var(--blue);
  font-weight:800;
}

.topic-group{
  margin-bottom:16px;
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  background:var(--panel);
}

.topic-head{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:0;
  color:var(--text);
  background:var(--panel-soft);
  padding:13px 14px;
  cursor:pointer;
  font-weight:800;
  text-align:left;
}

.topic-head:hover{
  color:var(--blue);
}

.topic-list{
  display:none;
  flex-direction:column;
  padding:8px 10px 10px;
}

.topic-group.open .topic-list{
  display:flex;
}

.topic-list a{
  color:var(--muted);
  text-decoration:none;
  padding:8px 8px;
  border-radius:7px;
  font-size:14px;
}

.topic-list a:hover{
  background:#263248;
  color:white;
}

.topic-list a.active{
  background:#0e7490;
  color:white;
  font-weight:800;
}

.main{
  flex:1;
  min-width:0;
  padding:30px;
}

.hero{
  margin-bottom:30px;
  padding:28px;
  background:linear-gradient(135deg,#182338,#111827);
  border:1px solid var(--border);
  border-radius:14px;
}

.hero h1{
  font-size:40px;
  margin-bottom:14px;
}

.hero p{
  color:var(--muted);
  margin-bottom:20px;
  line-height:1.65;
}

.search-area{
  position:relative;
}

.search-box{
  width:100%;
  padding:15px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  font-size:16px;
  background:#0b1220;
  color:white;
}

.search-box:focus{
  border-color:var(--blue);
}

.search-results{
  position:absolute;
  top:58px;
  left:0;
  right:0;
  display:none;
  max-height:400px;
  overflow-y:auto;
  background:#101827;
  border:1px solid var(--border);
  border-radius:10px;
  z-index:20;
  box-shadow:0 16px 36px rgba(0,0,0,.35);
}

.search-item{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.search-item:hover{
  background:var(--panel-soft);
}

.search-item h4{
  color:var(--blue);
  margin-bottom:5px;
}

.search-item p{
  color:var(--muted);
  font-size:13px;
  margin:0;
}

.search-item-badge{
  display:inline-block;
  background:var(--amber);
  color:#06111d;
  padding:2px 8px;
  border-radius:4px;
  font-size:11px;
  font-weight:700;
  margin-left:8px;
}

.level-section{
  margin-bottom:34px;
}

.level-title{
  font-size:26px;
  margin-bottom:15px;
  display:flex;
  align-items:center;
  gap:10px;
}

.level-title::before{
  content:"";
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--blue);
}

.content-section{
  background:var(--panel);
  padding:24px;
  border-radius:12px;
  margin-bottom:18px;
  border:1px solid var(--border);
}

.content-section h3{
  margin-bottom:13px;
  color:var(--blue);
  font-size:23px;
}

.topic-meta{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
  margin-bottom:16px;
  border-radius:999px;
  background:#0b1220;
  color:var(--muted);
  font-size:14px;
  font-weight:700;
}

.content-section p{
  color:#dbeafe;
  line-height:1.65;
}

.plain-explanation{
  margin-top:16px;
  padding:15px;
  border:1px solid rgba(125,211,252,.25);
  border-radius:8px;
  background:#07131f;
}

.plain-explanation h4{
  margin-bottom:8px;
  color:#7dd3fc;
  font-size:16px;
}

.plain-explanation ul{
  padding-left:20px;
  color:#dbeafe;
  line-height:1.7;
}

.plain-explanation li{
  margin-bottom:7px;
}

.code-box{
  margin-top:15px;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:10px;
  background:#07101f;
}

.code-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  background:#0b1220;
  color:var(--muted);
  font-weight:700;
}

.copy-btn{
  border:0;
  border-radius:7px;
  padding:7px 11px;
  background:var(--blue);
  color:#06111d;
  cursor:pointer;
  font-weight:800;
}

pre{
  margin:0;
  padding:15px;
  overflow:auto;
  color:#7dd3fc;
  font-size:13px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:16px;
}

th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

th{
  color:var(--blue);
  background:rgba(56,189,248,.08);
}

.topic-nav{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:22px;
}

.topic-nav button{
  min-width:130px;
  border:1px solid var(--border);
  border-radius:8px;
  padding:11px 14px;
  background:#0b1220;
  color:white;
  cursor:pointer;
  font-weight:800;
}

.topic-nav button:hover:not(:disabled){
  border-color:var(--blue);
  color:var(--blue);
}

.topic-nav button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.empty-state{
  display:none;
  color:var(--muted);
  padding:20px 0;
}

footer{
  margin-top:50px;
  text-align:center;
  color:#94a3b8;
  padding:20px 0;
}

@media(max-width:768px){
  .topbar{
    gap:10px;
  }

  .logo{
    font-size:20px;
  }

  .sidebar{
    position:fixed;
    left:0;
    top:70px;
    height:calc(100vh - 70px);
    z-index:999;
    box-shadow:16px 0 40px rgba(0,0,0,.35);
  }

  .main{
    width:100%;
    padding:20px;
  }

  .hero{
    padding:22px;
  }

  .hero h1{
    font-size:31px;
  }
}
</style>
</head>

<body>
<div class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Toggle sidebar">
    <i class="fa-solid fa-bars"></i>
  </button>
  <div class="logo">CodeVerse Master</div>
  <div class="language-scroll" id="languageTabs">
    <button class="lang-btn active" data-tab="linux">Linux Master</button>
    <button class="lang-btn" data-tab="java">Java</button>
    <button class="lang-btn" data-tab="python">Python</button>
    <button class="lang-btn" data-tab="sql">SQL</button>
  </div>
</div>

<div class="container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title" id="sidebarTitle">Linux Topics</div>
    <div id="topicGroups"></div>
  </aside>

  <main class="main">
    <section class="hero">
      <h1 id="heroTitle">Ultimate Linux Master Documentation</h1>
      <p id="heroText">Complete Linux kernel architecture, system calls, boot flow, and enterprise administration.</p>
      <div class="search-area">
        <input type="text" class="search-box" id="searchBox" placeholder="Search across all topics...">
        <div class="search-results" id="searchResults"></div>
      </div>
    </section>

    <div id="content"></div>
    <p class="empty-state" id="emptyState">No matching topics found.</p>
    <footer>CodeVerse | Advanced Documentation Platform</footer>
  </main>
</div>

<script>
// ============================================================================
// COMPLETE LINUX DOCUMENTATION WITH ALL SYSTEMS
// ============================================================================

const docs = {
  linux: {
    label: "Linux Master",
    description: "Complete Linux kernel internals, system architecture, administration, networking, and storage systems",
    levels: [
      {
        key: "core-1",
        title: "1.1 CORE ARCHITECTURE (Kernel + User Space)",
        topics: [
          {
            id: "linux-core-arch-1",
            number: 1,
            title: "Linux System Architecture - Kernel Space",
            body: "The Linux kernel is the core of the operating system that manages hardware and provides services to user applications.",
            code: `Kernel Space (Ring 0):
├─ CPU Scheduling
│  ├─ CFS (Completely Fair Scheduler)
│  ├─ Real-time scheduler
│  └─ Load balancing across cores
├─ Memory Management
│  ├─ Virtual memory (MMU)

            table: [
              ["Component", "Responsibility", "Example"],
              ["Scheduler", "Allocate CPU time", "process scheduling, context switching"],
              ["Memory", "Manage RAM and swap", "paging, TLB, OOM killer"],
              ["Device Drivers", "Hardware interface", "NIC, SATA, USB drivers"],
              ["VFS", "Unified filesystem", "ext4, xfs, NFS support"],
              ["Netfilter", "Packet filtering", "iptables, firewall rules"],
              ["IPC", "Process communication", "pipes, signals, sockets"]
            ]
          },
          {
            id: "linux-core-arch-2",
            number: 2,
            title: "Linux System Architecture - User Space",
            body: "User space contains applications, libraries, and system utilities that run with restricted privileges.",
            code: `User Space (Ring 3):
├─ Shell (bash, sh, zsh)
│  ├─ Command interpreter
│  ├─ Script execution
│  └─ Job control
├─ System Utilities
│  ├─ ls, cp, mv, rm
│  ├─ grep, awk, sed
│  └─ find, locate, xargs
├─ Applications
│  ├─ Web servers (nginx, Apache)
│  ├─ Databases (PostgreSQL, MySQL)
│  └─ Custom applications
└─ Daemons
   ├─ sshd (SSH service)
   ├─ nginx (Web server)
   └─ cron (Task scheduler)`,
            table: [
              ["Layer", "Purpose", "Examples"],
              ["Shell", "Command interface", "bash, zsh, fish"],
              ["Utilities", "System administration", "ls, grep, awk, sed"],
              ["Applications", "End-user software", "Docker, Kubernetes, Node.js"],
              ["Daemons", "Background services", "sshd, nginx, mysqld"]
            ]
          }
        ]
      },
      {
        key: "syscalls-2",
        title: "1.2 SYSTEM CALL INTERFACE (User ↔ Kernel Gateway)",
        topics: [
          {
            id: "linux-syscalls-1",
            number: 3,
            title: "Core System Calls - Process Management",
            body: "System calls bridge user space and kernel space, allowing applications to request OS services.",
            code: `Process Management Syscalls:

fork() - Create new process
  - Duplicates parent process
  - Child gets new PID
  - Returns parent PID to parent, 0 to child

vfork() - Fast process creation
  - Child shares parent's memory
  - Parent blocked until child exec()

execve() - Execute program
  - Replace process image with new program
  - Loads new executable

wait() / waitpid() - Wait for child
  - Parent blocks until child exits
  - Prevents zombie processes

clone() - Advanced process creation
  - Create thread or process
  - Fine-grained control over sharing`,
            table: [
              ["Syscall", "Purpose", "Return Value"],
              ["fork()", "Create new process", "PID in parent, 0 in child"],
              ["execve()", "Replace process", "Never returns on success"],
              ["wait()", "Wait for child", "Child's PID and exit status"],
              ["clone()", "Create thread/process", "New PID/TID"]
            ]
          },
          {
            id: "linux-syscalls-2",
            number: 4,
            title: "Core System Calls - File Operations",
            body: "File-related system calls provide access to filesystem data.",
            code: `File Operation Syscalls:

open() - Open file descriptor

read() - Read data from file

write() - Write data to file
  bytes_written = write(fd, data, length);

close() - Close file descriptor
  close(fd);

lseek() - Seek in file
  offset = lseek(fd, pos, SEEK_SET);

stat() - Get file metadata
  stat(filename, &statbuf);

mmap() - Memory map file
  void *addr = mmap(NULL, size, PROT_READ,

            table: [
              ["Syscall", "Purpose", "Example"],
              ["open()", "Create/open file", "open('/etc/passwd', O_RDONLY)"],
              ["read()", "Read bytes", "read(fd, buf, 1024)"],
              ["write()", "Write bytes", "write(fd, 'data', 4)"],
              ["close()", "Close descriptor", "close(fd)"],
              ["stat()", "Get metadata", "stat('/tmp', &sb)"]
            ]
          }
        ]
      },
      {
        key: "kernel-iface-3",
        title: "1.3 KERNEL INTERFACES (/proc /sys /dev)",
        topics: [
          {
            id: "linux-proc-1",
            number: 5,
            title: "/proc Filesystem - Process Information",
            body: "The /proc filesystem is a virtual interface to kernel data structures and process information.",
            code: `/proc/<pid>/
├─ cmdline        → command line arguments
├─ environ        → environment variables
├─ fd/            → file descriptors
├─ maps           → memory map
├─ stat           → process statistics
├─ status         → process status
└─ io             → I/O statistics

System Information:
/proc/cpuinfo     → CPU information
/proc/meminfo     → Memory information
/proc/loadavg     → System load average
/proc/uptime      → System uptime
/proc/net/        → Network statistics`,
            table: [
              ["File", "Content", "Example Command"],
              ["/proc/cpuinfo", "CPU details", "grep processor /proc/cpuinfo"],
              ["/proc/meminfo", "Memory stats", "grep MemTotal /proc/meminfo"],
              ["/proc/loadavg", "Load average", "cat /proc/loadavg"],
              ["/proc/<pid>/stat", "Process stats", "cat /proc/1234/stat"]
            ]
          }
        ]
      },
      {
        key: "boot-init-4",
        title: "1.4 BOOT SEQUENCE & SYSTEMD INIT",
        topics: [
          {
            id: "linux-boot-1",
            number: 6,
            title: "Boot Pipeline - BIOS to systemd",
            body: "Linux boot process from firmware to fully booted system.",
            code: `Boot Sequence:

1. FIRMWARE PHASE
   ├─ BIOS/UEFI startup
   ├─ Hardware initialization
   ├─ Bootloader loading (GRUB2)
   └─ Kernel image loading

2. KERNEL PHASE
   ├─ Kernel decompression
   ├─ Memory initialization
   ├─ Device driver loading
   └─ Root filesystem discovery

3. INITRAMFS PHASE
   ├─ Minimal root filesystem
   ├─ Storage driver loading
   ├─ Filesystem check (fsck)
   └─ Root filesystem mounting

4. SYSTEMD PHASE
   ├─ Load configuration
   ├─ Parse target
   ├─ Start services

            table: [
              ["Stage", "Loader", "Function"],
              ["Firmware", "BIOS/UEFI", "Hardware init"],
              ["Bootloader", "GRUB2", "Kernel selection"],
              ["Kernel", "Linux kernel", "Hardware detection"],
              ["Initramfs", "Busybox", "Boot environment"],
              ["Init", "systemd", "Service orchestration"]
            ]
          }
        ]
      }
    ]
  },
  java: {
    label: "Java",
    description: "Java programming language fundamentals",
    levels: [{
      key: "basic",
      title: "Basic Java",
      topics: [{
        id: "java-1",
        number: 1,
        title: "Java Basics",
        body: "Java is a widely-used object-oriented programming language.",
        code: `public class HelloWorld {
  public static void main(String[] args) {

      }]
    }]

  python: {
    label: "Python",

name = 'Alice'

  },
  sql: {
    label: "SQL",
    description: "SQL database queries",
    levels: [{
      key: "basic",
      title: "Basic SQL",
      topics: [{
        id: "sql-1",
        number: 1,

// ============================================================================
// GLOBAL STATE & DOM ELEMENTS
// ============================================================================

const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const languageTabs = document.getElementById("languageTabs");
const tabs = document.querySelectorAll(".lang-btn");
const sidebarTitle = document.getElementById("sidebarTitle");
const topicGroups = document.getElementById("topicGroups");
const heroTitle = document.getElementById("heroTitle");
const heroText = document.getElementById("heroText");
const searchBox = document.getElementById("searchBox");
const searchResults = document.getElementById("searchResults");
const content = document.getElementById("content");
const emptyState = document.getElementById("emptyState");

let activeTab = "linux";
let activeTopicId = "";
let currentTopics = [];
let searchIndex = [];

// ============================================================================
// UTILITY FUNCTIONS
// ============================================================================

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function buildSearchIndex() {
  searchIndex = [];
  
  Object.entries(docs).forEach(([tab, doc]) => {
    doc.levels.forEach(level => {
      level.topics.forEach(topic => {
        searchIndex.push({
          type: 'topic',
          tab: tab,
          id: topic.id,
          title: topic.title,
          body: topic.body,
          code: topic.code || '',
          searchText: `${topic.title} ${topic.body} ${topic.code || ''}`.toLowerCase()
        });
      });
    });
  });
}

// ============================================================================
// RENDER FUNCTIONS
// ============================================================================

function renderTable(rows) {
  if (!rows || !rows.length) return "";
  
  const [header, ...body] = rows;
  return `
    <table>
      <thead>
        <tr>${header.map(cell => `<th>${escapeHtml(cell)}</th>`).join("")}</tr>
      </thead>
      <tbody>
        ${body.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("")}
      </tbody>
    </table>
  `;
}

function renderCode(code) {
  if (!code) return "";
  
  return `
    <div class="code-box">
      <div class="code-header">
        <span>Code Example</span>
        <button class="copy-btn" type="button">Copy</button>
      </div>
      <pre><code>${escapeHtml(code)}</code></pre>
    </div>
  `;
}

function renderTopic(topic) {
  const topicIndex = currentTopics.findIndex(item => item.id === topic.id);
  const previousTopic = currentTopics[topicIndex - 1];
  const nextTopic = currentTopics[topicIndex + 1];

  return `
    <article id="${escapeHtml(topic.id)}" class="content-section">
      <h3>${escapeHtml(topic.title)}</h3>
      <div class="topic-meta">${escapeHtml(topic.levelTitle || "Topic")}</div>
      <p>${escapeHtml(topic.body)}</p>
      
      <div class="plain-explanation">
        <h4>Key Points</h4>
        <ul>
          <li><strong>What it is:</strong> ${escapeHtml(topic.body)}</li>
          <li><strong>When to use:</strong> Use this when working with system administration or Linux operations.</li>
          <li><strong>How to read:</strong> Start from the top and follow the hierarchical structure.</li>
        </ul>
      </div>

      ${renderCode(topic.code)}
      ${renderTable(topic.table)}

      <div class="topic-nav">
        <button type="button" class="topic-nav-btn" data-topic-id="${previousTopic ? escapeHtml(previousTopic.id) : ""}" ${previousTopic ? "" : "disabled"}>← Previous</button>
        <button type="button" class="topic-nav-btn" data-topic-id="${nextTopic ? escapeHtml(nextTopic.id) : ""}" ${nextTopic ? "" : "disabled"}>Next →</button>
      </div>
    </article>
  `;
}

function renderSidebar(doc) {
  const levels = doc.levels;
  
  topicGroups.innerHTML = levels.map((level, index) => `
    <div class="topic-group ${index === 0 ? "open" : ""}">
      <button class="topic-head" type="button">
        <span>${escapeHtml(level.title)}</span>
        <i class="fa-solid ${index === 0 ? "fa-chevron-up" : "fa-chevron-down"}"></i>
      </button>
      <nav class="topic-list">
        ${level.topics.map((topic, tIndex) => `
          <a href="#${escapeHtml(topic.id)}" data-topic-id="${escapeHtml(topic.id)}">
            ${escapeHtml((topic.number || tIndex + 1) + ". " + topic.title)}
          </a>
        `).join("")}
      </nav>
    </div>
  `).join("");
}

// ============================================================================
// EVENT HANDLERS
// ============================================================================

function wireSidebarGroups() {
  document.querySelectorAll(".topic-head").forEach(head => {
    head.addEventListener("click", () => {
      const group = head.closest(".topic-group");
      const icon = head.querySelector("i");
      const isOpen = group.classList.toggle("open");
      
      icon.classList.toggle("fa-chevron-up", isOpen);
      icon.classList.toggle("fa-chevron-down", !isOpen);
    });
  });

  document.querySelectorAll(".topic-list a").forEach(link => {
    link.addEventListener("click", event => {
      event.preventDefault();
      selectTopic(link.dataset.topicId);
    });
  });
}

function wireCopyButtons() {
  document.querySelectorAll(".copy-btn").forEach(button => {
    button.addEventListener("click", () => {
      const code = button.closest(".code-box").querySelector("code").innerText;
      navigator.clipboard.writeText(code).then(() => {
        button.textContent = "Copied!";
        setTimeout(() => {
          button.textContent = "Copy";
        }, 1400);
      });
    });
  });
}

function updateSidebarActive(topicId) {
  document.querySelectorAll(".topic-list a").forEach(link => {
    link.classList.toggle("active", link.dataset.topicId === topicId);
  });
}

function selectTopic(topicId) {
  const topic = currentTopics.find(item => item.id === topicId);
  
  if (!topic) return;
  
  activeTopicId = topic.id;
  content.innerHTML = renderTopic(topic);
  emptyState.style.display = "none";
  updateSidebarActive(activeTopicId);
  wireCopyButtons();
  wireTopicNavButtons();
  
  content.scrollIntoView({ behavior: "smooth", block: "start" });
}

function wireTopicNavButtons() {
  document.querySelectorAll(".topic-nav-btn").forEach(button => {
    button.addEventListener("click", () => {
      if (button.disabled || !button.dataset.topicId) return;
      selectTopic(button.dataset.topicId);
    });
  });
}

function performSearch(query) {
  if (!query.trim()) {
    searchResults.style.display = "none";
    return;
  }

  const lowerQuery = query.toLowerCase();
  const matches = searchIndex
    .filter(item => item.searchText.includes(lowerQuery))
    .slice(0, 15);

  if (matches.length === 0) {
    searchResults.innerHTML = `
      <div class="search-item">
        <h4>No results found</h4>
        <p>Try different keywords</p>
      </div>
    `;
    searchResults.style.display = "block";
    return;
  }

  searchResults.innerHTML = matches.map(item => `
    <div class="search-item" data-tab="${item.tab}" data-topic-id="${item.id}">
      <h4>${escapeHtml(item.title)}</h4>
      <p>
        ${escapeHtml(item.body.substring(0, 80))}...
        <span class="search-item-badge">${item.tab.toUpperCase()}</span>
      </p>
    </div>
  `).join("");

  searchResults.style.display = "block";

  document.querySelectorAll(".search-item").forEach(item => {
    item.addEventListener("click", () => {
      const tab = item.dataset.tab;
      const topicId = item.dataset.topicId;
      
      switchTabAndSelectTopic(tab, topicId);
      searchBox.value = "";
      searchResults.style.display = "none";
    });
  });
}

function switchTabAndSelectTopic(tab, topicId) {
  activeTab = tab;
  const doc = docs[tab];
  
  if (!doc) return;

  currentTopics = [];
  doc.levels.forEach(level => {
    level.topics.forEach(topic => {
      topic.levelTitle = level.title;
      currentTopics.push(topic);
    });
  });

  sidebarTitle.textContent = `${doc.label} Topics`;
  heroTitle.textContent = `${doc.label} Master Guide`;
  heroText.textContent = doc.description;

  renderSidebar(doc);
  wireSidebarGroups();
  
  tabs.forEach(t => t.classList.remove("active"));
  document.querySelector(`[data-tab="${tab}"]`).classList.add("active");

  selectTopic(topicId);
}

function renderTab(tabName) {
  const doc = docs[tabName];
  activeTab = tabName;
  currentTopics = [];

  doc.levels.forEach(level => {
    level.topics.forEach(topic => {
      topic.levelTitle = level.title;
      currentTopics.push(topic);
    });
  });

  sidebarTitle.textContent = `${doc.label} Topics`;
  heroTitle.textContent = `${doc.label} Master Guide`;
  heroText.textContent = doc.description;
  searchBox.placeholder = `Search ${doc.label}...`;
  searchBox.value = "";
  searchResults.style.display = "none";

  renderSidebar(doc);
  wireSidebarGroups();
  selectTopic(currentTopics[0]?.id);
}

// ============================================================================
// EVENT LISTENERS
// ============================================================================

menuBtn.addEventListener("click", () => {
  sidebar.classList.toggle("hide");
});

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(item => item.classList.remove("active"));
    tab.classList.add("active");
    renderTab(tab.dataset.tab);
  });
});

searchBox.addEventListener("input", (e) => {
  performSearch(e.target.value);
});

document.addEventListener("click", event => {
  if (!event.target.closest(".search-area")) {
    searchResults.style.display = "none";
  }
});

// ============================================================================
// STARTUP
// ============================================================================

buildSearchIndex();
renderTab("linux");
</script>
</body>
</html>
