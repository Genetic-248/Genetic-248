<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Master Cheat Sheet</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  scroll-behavior:smooth;
  font-family:Arial,sans-serif;
}

:root{
  --bg:#101624;
  --panel:#171f2f;
  --panel-soft:#202a3d;
  --border:#324158;
  --text:#f8fafc;
  --muted:#cbd5e1;
  --blue:#38bdf8;
  --green:#34d399;
  --amber:#fbbf24;
  --rose:#fb7185;
}

body{
  background:linear-gradient(135deg,#101624,#172033 55%,#141827);
  color:var(--text);
  overflow-x:hidden;
}

.topbar{
  height:70px;
  background:#121a29;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 20px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:1000;
}

.menu-btn{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:8px;
  background:transparent;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.menu-btn:hover{
  background:var(--panel-soft);
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:var(--blue);
  white-space:nowrap;
}

.language-scroll{
  display:flex;
  gap:10px;
  overflow-x:auto;
  flex:1;
  justify-content:flex-end;
}

.lang-btn{
  min-width:82px;
  padding:9px 16px;
  border:1px solid transparent;
  border-radius:8px;
  background:var(--panel-soft);
  color:white;
  cursor:pointer;
  font-weight:700;
}

.lang-btn:hover{
  border-color:var(--blue);
}

.lang-btn.active{
  background:var(--blue);
  color:#06111d;
}

.container{
  display:flex;
  min-height:calc(100vh - 70px);
}

.sidebar{
  width:310px;
  flex:0 0 310px;
  background:#121a29;
  border-right:1px solid var(--border);
  padding:22px;
  overflow-y:auto;
  transition:.3s;
}

.sidebar.hide{
  margin-left:-310px;
}

.sidebar-title{
  font-size:23px;
  margin-bottom:18px;
  color:var(--blue);
  font-weight:800;
}

.topic-group{
  margin-bottom:16px;
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  background:var(--panel);
}

.topic-head{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:0;
  color:var(--text);
  background:var(--panel-soft);
  padding:13px 14px;
  cursor:pointer;
  font-weight:800;
  text-align:left;
}

.topic-head:hover{
  color:var(--blue);
}

.topic-list{
  display:none;
  flex-direction:column;
  padding:8px 10px 10px;
}

.topic-group.open .topic-list{
  display:flex;
}

.topic-list a{
  color:var(--muted);
  text-decoration:none;
  padding:8px 8px;
  border-radius:7px;
}

.topic-list a:hover{
  background:#263248;
  color:white;
}

.topic-list a.active{
  background:#0e7490;
  color:white;
  font-weight:800;
}

.main{
  flex:1;
  min-width:0;
  padding:30px;
}

.hero{
  margin-bottom:30px;
  padding:28px;
  background:linear-gradient(135deg,#182338,#111827);
  border:1px solid var(--border);
  border-radius:14px;
}

.hero h1{
  font-size:40px;
  margin-bottom:14px;
}

.hero p{
  color:var(--muted);
  margin-bottom:20px;
  line-height:1.65;
}

.search-area{
  position:relative;
}

.search-box{
  width:100%;
  padding:15px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  font-size:16px;
  background:#0b1220;
  color:white;
}

.search-box:focus{
  border-color:var(--blue);
}

.search-results{
  position:absolute;
  top:58px;
  left:0;
  right:0;
  display:none;
  max-height:360px;
  overflow-y:auto;
  background:#101827;
  border:1px solid var(--border);
  border-radius:10px;
  z-index:20;
  box-shadow:0 16px 36px rgba(0,0,0,.35);
}

.search-item{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.search-item:hover{
  background:var(--panel-soft);
}

.search-item h4{
  color:var(--blue);
  margin-bottom:5px;
}

.search-item p{
  color:var(--muted);
  font-size:14px;
  margin:0;
}

.level-section{
  margin-bottom:34px;
}

.level-title{
  font-size:26px;
  margin-bottom:15px;
  display:flex;
  align-items:center;
  gap:10px;
}

.level-title::before{
  content:"";
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--blue);
}

.level-section[data-level="basic"] .level-title::before{
  background:var(--green);
}

.level-section[data-level="intermediate"] .level-title::before{
  background:var(--amber);
}

.level-section[data-level="advanced"] .level-title::before{
  background:var(--rose);
}

.content-section{
  background:var(--panel);
  padding:24px;
  border-radius:12px;
  margin-bottom:18px;
  border:1px solid var(--border);
}

.content-section h3{
  margin-bottom:13px;
  color:var(--blue);
  font-size:23px;
}

.topic-meta{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
  margin-bottom:16px;
  border-radius:999px;
  background:#0b1220;
  color:var(--muted);
  font-size:14px;
  font-weight:700;
}

.content-section p{
  color:#dbeafe;
  line-height:1.65;
}

.plain-explanation{
  margin-top:16px;
  padding:15px;
  border:1px solid rgba(125,211,252,.25);
  border-radius:8px;
  background:#07131f;
}

.plain-explanation h4{
  margin-bottom:8px;
  color:#7dd3fc;
  font-size:16px;
}

.plain-explanation ul{
  padding-left:20px;
  color:#dbeafe;
  line-height:1.7;
}

.plain-explanation li{
  margin-bottom:7px;
}

.extensions-box{
  margin-top:16px;
  padding:15px;
  border:1px solid rgba(125,211,252,.28);
  border-radius:9px;
  background:#061521;
}

.extensions-box h4{
  margin-bottom:8px;
  color:#7dd3fc;
  font-size:16px;
}

.extensions-box p{
  color:#dbeafe;
  margin-bottom:10px;
}

.extensions-box table{
  margin-top:10px;
}

.extensions-box td:first-child{
  color:#fde68a;
  font-family:Consolas,Monaco,monospace;
  white-space:nowrap;
}

.real-world-box{
  margin-top:16px;
  padding:15px;
  border-left:4px solid var(--green);
  border-radius:8px;
  background:#0b1f1a;
}

.real-world-box h4{
  margin-bottom:8px;
  color:var(--green);
  font-size:16px;
}

.real-world-box p{
  color:#d1fae5;
}

.real-world-box ol{
  margin-top:10px;
  padding-left:22px;
  color:#d1fae5;
  line-height:1.7;
}

.real-world-box li{
  margin-bottom:7px;
}

.real-world-box code{
  background:#06130f;
  border:1px solid rgba(52,211,153,.25);
  border-radius:5px;
  padding:2px 5px;
  color:#86efac;
}

.example-levels{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  margin-top:14px;
}

.example-level{
  border:1px solid rgba(52,211,153,.25);
  border-radius:9px;
  padding:13px;
  background:#071713;
}

.example-level h5,
.breakdown-box h5{
  margin-bottom:8px;
  color:#86efac;
  font-size:15px;
}

.example-level p{
  margin-bottom:8px;
}

.example-command{
  display:block;
  margin:8px 0;
  padding:8px;
  border-radius:7px;
  background:#030b08;
  color:#7dd3fc;
  overflow-x:auto;
}

.breakdown-box{
  margin-top:14px;
  padding:13px;
  border:1px solid rgba(125,211,252,.25);
  border-radius:9px;
  background:#07131f;
}

.breakdown-row{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid rgba(125,211,252,.16);
}

.breakdown-row:first-of-type{
  border-top:0;
  padding-top:0;
}

.breakdown-row strong{
  display:block;
  margin-bottom:6px;
  color:#7dd3fc;
}

.sample-program-box{
  margin-top:16px;
  padding:15px;
  border:1px solid rgba(251,191,36,.28);
  border-radius:9px;
  background:#1f1606;
}

.sample-program-box h4{
  margin-bottom:8px;
  color:var(--amber);
  font-size:16px;
}

.sample-program-box p{
  color:#fef3c7;
  line-height:1.65;
}

.sample-program-box pre{
  margin-top:12px;
  background:#080500;
  color:#fde68a;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:16px;
}

th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

th{
  color:var(--blue);
}

.code-box{
  margin-top:15px;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:10px;
  background:#07101f;
}

.code-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  background:#0b1220;
  color:var(--muted);
  font-weight:700;
}

.copy-btn{
  border:0;
  border-radius:7px;
  padding:7px 11px;
  background:var(--blue);
  color:#06111d;
  cursor:pointer;
  font-weight:800;
}

pre{
  margin:0;
  padding:15px;
  overflow:auto;
  color:#7dd3fc;
}

.topic-nav{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:22px;
}

.topic-nav button{
  min-width:130px;
  border:1px solid var(--border);
  border-radius:8px;
  padding:11px 14px;
  background:#0b1220;
  color:white;
  cursor:pointer;
  font-weight:800;
}

.topic-nav button:hover:not(:disabled){
  border-color:var(--blue);
  color:var(--blue);
}

.topic-nav button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.cmd-tabs{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  padding:20px 30px 0;
}

.cmd-tab-button{
  border:none;
  background:#0d1d35;
  color:#cbd5e1;
  border-radius:999px;
  padding:12px 18px;
  cursor:pointer;
  transition:.2s;
}

.cmd-tab-button.active{
  background:#38bdf8;
  color:#06111d;
}

.cmd-details-list{
  padding:0 30px 30px;
}

.command-summary{
  margin-top:0;
  color:#dbeafe;
  font-size:15px;
  line-height:1.8;
}

.command-usecases{
  margin-top:18px;
  padding:18px 20px;
  border:1px solid rgba(56,189,248,0.18);
  border-radius:12px;
  background:#071a2a;
}

.command-usecases h5,
.command-related h5{
  margin-bottom:12px;
  color:#38bdf8;
  font-size:15px;
}

.command-usecases ul{
  padding-left:20px;
  color:#dbeafe;
  line-height:1.7;
}

.command-usecases li{
  margin-bottom:10px;
}

.example-table{
  width:100%;
  border-collapse:collapse;
  margin-top:16px;
}

.example-table th,
.example-table td{
  padding:10px 12px;
  border:1px solid rgba(56,189,248,0.14);
  text-align:left;
}

.example-table th{
  background:rgba(56,189,248,0.08);
  color:#7dd3fc;
}

.example-table td code{
  display:block;
  background:rgba(15,23,42,0.9);
  padding:2px 4px;
  border-radius:4px;
  color:#a5f3fc;
}

.command-related{
  margin-top:18px;
  padding:18px 20px;
  border:1px solid rgba(125,211,252,0.22);
  border-radius:12px;
  background:#071a2a;
}

.command-related p,
.command-related li{
  color:#dbeafe;
  line-height:1.7;
}

.command-related ul{
  padding-left:20px;
  margin:12px 0 0;
}

.command-related li{
  margin-bottom:8px;
}

.subtopic-groups{
  display:grid;
  gap:20px;
  margin:16px 30px 0;
}

.subtopic-card{
  border:1px solid rgba(56,189,248,0.18);
  border-radius:16px;
  background:#0c1a2c;
  overflow:hidden;
}

.subtopic-card-header{
  padding:18px 22px;
  background:linear-gradient(180deg,rgba(3,25,52,0.96),rgba(6,41,74,0.92));
  border-bottom:1px solid rgba(56,189,248,0.12);
}

.subtopic-card-header h4{
  margin:0 0 6px;
  color:#38bdf8;
  font-size:18px;
}

.subtopic-card-header p{
  margin:0;
  color:#cbd5e1;
  line-height:1.6;
}

.subtopic-card-body{
  padding:18px 22px 22px;
  display:grid;
  gap:14px;
}

.cmd-details{
  display:none;
}

.cmd-details.active{
  display:block;
}

.card{
  border:1px solid rgba(56,189,248,0.18);
  border-radius:14px;
  margin:16px 30px 0;
  background:#071a2a;
  overflow:hidden;
  transition:box-shadow .2s ease, transform .2s ease;
}

.card:hover{
  box-shadow:0 16px 35px rgba(0,0,0,0.18);
  transform:translateY(-1px);
}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:18px 22px;
  background:linear-gradient(180deg,rgba(3,25,52,0.96),rgba(5,37,76,0.86));
  color:#e2e8f0;
  cursor:pointer;
  font-weight:800;
}

.card-header .arrow{
  font-size:14px;
  color:#38bdf8;
}

.card-content{
  max-height:0;
  overflow:hidden;
  padding:0 22px;
  transition:max-height .28s ease, padding .28s ease;
}

.card.expanded .card-content{
  max-height:1000px;
  padding:18px 22px 22px;
}

.card-content p,
.card-content h4,
.card-content table,
.card-content pre{
  margin:0 0 14px;
}

.card-content table{
  width:100%;
  border-collapse:collapse;
  background:rgba(15,23,42,0.85);
}

.card-content table th,
.card-content table td{
  padding:10px 12px;
  border:1px solid rgba(56,189,248,0.12);
  text-align:left;
  font-size:14px;
}

.card-content pre{
  background:rgba(15,23,42,0.95);
  border-radius:10px;
  padding:14px;
  overflow:auto;
  color:#7dd3fc;
}

.empty-state{
  display:none;
  color:var(--muted);
  padding:20px 0;
}

footer{
  margin-top:50px;
  text-align:center;
  color:#94a3b8;
  padding:20px 0;
}

@media(max-width:768px){
  .topbar{
    gap:10px;
  }

  .logo{
    font-size:20px;
  }

  .sidebar{
    position:fixed;
    left:0;
    top:70px;
    height:calc(100vh - 70px);
    z-index:999;
    box-shadow:16px 0 40px rgba(0,0,0,.35);
  }

  .main{
    width:100%;
    padding:20px;
  }

  .hero{
    padding:22px;
  }

  .hero h1{
    font-size:31px;
  }
}
</style>
</head>

<body>
<div class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Toggle sidebar" title="Toggle sidebar">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="logo">CodeVerse</div>

  <div class="language-scroll" id="languageTabs">
    <button class="lang-btn active" data-tab="linux">Linux</button>
    <button class="lang-btn" data-tab="shell">Shell</button>
    <button class="lang-btn" data-tab="java">Java</button>
    <button class="lang-btn" data-tab="python">Python</button>
    <button class="lang-btn" data-tab="sql">SQL</button>
  </div>
</div>

<div class="container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title" id="sidebarTitle">Linux Topics</div>
    <div id="topicGroups"></div>
  </aside>

  <main class="main">
    <section class="hero">
      <h1 id="heroTitle">Ultimate Linux Documentation Portal</h1>
      <p id="heroText">
        A complete interactive command reference for Linux administration and shell workflows.
      </p>

      <div class="search-area">
        <input type="text" class="search-box" id="searchBox" placeholder="Search Linux topics...">
        <div class="search-results" id="searchResults"></div>
      </div>
    </section>

    <div id="content"></div>
    <p class="empty-state" id="emptyState">No matching topics found.</p>

    <footer>CodeVerse | Advanced Documentation Platform</footer>
  </main>
</div>

<script>
function slugify(value){
  return String(value)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

function commandUseCases(command, rest, purpose){
  const key = command.toLowerCase();
  const useCases = {
    pwd: [
      "Confirm your current working directory.",
      "Use before running file or directory commands to avoid mistakes."
    ],
    ls: [
      "List files and directories in the current folder.",
      "Combine with options like -l or -a to inspect file details."
    ],
    cd: [
      "Move between directories in the shell.",
      "Use it to navigate into a target folder before running commands."
    ],
    clear: [
      "Clear the terminal screen for a fresh workspace.",
      "Use it when output gets noisy and you want to focus on the next command."
    ],
    history: [
      "Review recently executed commands.",
      "Use it to repeat or audit a previous shell action."
    ],
    whoami: [
      "Verify the current user identity.",
      "Use when you need to confirm permissions before executing a task."
    ],
    id: [
      "Inspect numeric user and group IDs.",
      "Use it when writing scripts that depend on specific permissions."
    ],
    hostname: [
      "Check the machine hostname.",
      "Use it for network or remote configuration tasks."
    ],
    uname: [
      "Display kernel and system information.",
      "Use it when debugging compatibility or environment issues."
    ],
    man: [
      "Open the manual page for a command.",
      "Use it to learn options and usage syntax before running a command."
    ],
    chmod: [
      "Change file or directory permissions.",
      "Use it when a file needs to be readable, writable, or executable."
    ],
    chown: [
      "Change file ownership.",
      "Use it to transfer ownership to a new user or group."
    ],
    chgrp: [
      "Change the group ownership of a file.",
      "Use it when group-based access control needs adjustment."
    ],
    umask: [
      "Set default file creation permissions.",
      "Use it to control how new files are created from the shell."
    ],
    getfacl: [
      "Display access control lists for files.",
      "Use it to inspect complex permissions beyond standard mode bits."
    ],
    setfacl: [
      "Modify file ACL entries.",
      "Use it to give specific users or groups fine-grained access."
    ],
    sudo: [

      "Run a command with elevated privileges.",
      "Use it when a task requires root-level access."
    ],
    su: [
      "Switch user accounts in the terminal.",
      "Use it to run commands as another user or root."
    ],
    ps: [
      "List running processes.",
      "Use it to identify processes for monitoring or termination."
    ],
    top: [
      "Monitor active processes and resource usage in real time.",
      "Use it to spot high CPU or memory consumers."
    ],
    kill: [
      "Terminate a process by PID.",
      "Use it to stop a misbehaving or hung process."
    ],
    pgrep: [
      "Find process IDs by name.",
      "Use it before killing or inspecting specific services."
    ],
    pkill: [
      "Send signals to processes by name.",
      "Use it to terminate groups of related processes."
    ],
    find: [
      "Search for files and directories.",
      "Use it to locate files by name, size, time, or content."
    ],
    grep: [
      "Search text content inside files.",
      "Use it to quickly filter logs and configuration files."
    ],
    awk: [
      "Process and transform text-based data.",
      "Use it for field-based extraction and reporting."
    ],
    sed: [
      "Stream-edit text using patterns.",
      "Use it for quick file edits without opening an editor."
    ],
    tar: [
      "Create or extract archive files.",
      "Use it to package backups or move large directories."
    ],
    rsync: [
      "Sync files between local and remote destinations.",
      "Use it for fast incremental backups and deployment."
    ],
    ssh: [
      "Open a secure shell session to a remote host.",
      "Use it to administer remote machines or transfer files."
    ],
    curl: [
      "Fetch data from URLs.",
      "Use it to test web endpoints and download files."
    ],
    wget: [
      "Download files from the web.",
      "Use it when you need a simple command-line downloader."
    ]
  };

  return useCases[key] || [
    `Use ${command}${rest ? ` ${rest}` : ""} to ${purpose}.`,
    "Refer to the command manual or help flag for additional options.",
    "Combine it with pipes and redirection to build practical shell workflows."
  ];
}

function commandCombinations(command){
  const key = command.toLowerCase();
  const combos = {
    mount: [
      "mount /dev/sdb1 /mnt/usb",
      "mount -o rw,nodev /dev/sdb1 /mnt/data",
      "mount -t ext4 UUID=xxxx-xxxx /mnt/storage",
      "mount --bind /src /dst"
    ],

function parseCommandItems(topicId, code, purpose, title){
  const lines = String(code)
    .split("\n")
    .map(line => line.trim())
    .filter(Boolean);

  if(!lines.length){
    return [];
  }

  if(lines[0].startsWith("#!")){
    return [{
      id: `${topicId}-script`,
      name: "Shell script",
      title: "Shell script",
      summary: `Shell script example for ${title}`,
      description: `A complete shell script that automates ${purpose}. Use it as a template for repeatable Linux tasks.`,
      code,
      useCases: [
        `Automate the ${purpose} process with a single script.`,
        "Reuse it as a daily task or scheduled job.",
        "Adjust variables to match your environment and targets."
      ],
      details: `Review the script from top to bottom: variables are defined first, then the directory is created, files are copied, and a status message is printed.`
    }];
  }

  return lines.map((line, index) => {
    const parts = line.split(/\s+/);
    const command = parts[0];
    const rest = parts.slice(1).join(" ");

    return {
      id: `${topicId}-${slugify(command)}-${index + 1}`,
      name: command,
      title: command,
      summary: rest ? `${command} ${rest}` : `${command}`,
      description: rest
        ? `${command} ${rest} — use it to ${purpose}.`
        : `${command} — use it to ${purpose}.`,
      code: line,
      useCases: commandUseCases(command, rest, purpose),
      combinations: commandCombinations(command),
      details: `This command is part of the ${title} group and helps you ${purpose}.`
    };
  });
}

function linuxTopics(items){
  return items.map(([number, title, purpose, code]) => {
    const subject = title.split(" - ")[0].split(":")[0];
    const id = `linux-${slugify(subject)}`;
    const commands = parseCommandItems(id, code, purpose, title);

    return {
      number,
      id,
      title,
      body: `${subject} is used to ${purpose}. This subtopic focuses only on ${title}.`,
      subject,
      purpose,
      code,
      commands,
      subtopics: commands.length ? [{
        title,
        description: `Commands and examples for ${title}.`,
        commands
      }] : []
    };
  });
}

function escapeHtml(value){
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function levelNumberedTopics(level){
  return level.topics.map((topic, index) => ({
    ...topic,
    levelTitle: level.title,
    levelKey: level.key,
    number: topic.number || index + 1
  }));
}

function numberedLevels(doc){
  let nextNumber = 1;

  return doc.levels.map(level => ({
    ...level,
    topics: level.topics.map(topic => ({
      ...topic,
      originalNumber: topic.number,
      levelTitle: level.title,
      levelKey: level.key,
      number: nextNumber++
    }))
  }));
}

function getAllTopics(doc){
  return numberedLevels(doc).flatMap(level => level.topics);
}

function topicLabel(topic){
  return `${topic.number ? topic.number + ". " : ""}${topic.title}`;
}

function renderTable(rows){
  if(!rows){
    return "";
  }

  const [header, ...body] = rows;

  return `
    <table>
      <thead>
        <tr>${header.map(cell => `<th>${escapeHtml(cell)}</th>`).join("")}</tr>
      </thead>
      <tbody>
        ${body.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("")}
      </tbody>
    </table>
  `;
}

function getCodeLanguage(){
  if(activeTab === "sql") return "sql";
  if(activeTab === "python") return "python";
  if(activeTab === "java") return "java";
  return "bash";
}

function renderCode(code){
  if(!code){
    return "";
  }

  return `
    <div class="code-box">
      <div class="code-header">
        <span>Example</span>
        <button class="copy-btn" type="button">Copy</button>
      </div>
      <pre><code class="language-${getCodeLanguage()}">${escapeHtml(code)}</code></pre>
    </div>
  `;
}

function firstExampleLine(code){
  if(!code){
    return "";
  }

  return code.split("\n").find(line => line.trim())?.trim() || "";
}

function exampleLines(code){
  if(!code){
    return [];
  }

  return code.split("\n").map(line => line.trim()).filter(Boolean);
}

function pickExample(lines, index){
  if(!lines.length){
    return "";
  }

  return lines[index] || lines[lines.length - 1];
}

function explainExampleLine(topic, line){
  if(activeTab === "linux"){
    const parts = line.split(/\s+/);
    const command = parts[0] || topic.subject || topic.title;
    const rest = parts.slice(1).join(" ");
    const purpose = topic.purpose || "complete the task";

    if(rest){
      return `This runs ${command}. The extra part, ${rest}, gives the command its options, input, file name, folder name, filter, or target. In this topic, that helps you ${purpose}.`;
    }

    return `This runs ${command} by itself. That is usually the simplest form of the command, and it helps you ${purpose} with the default behavior.`;
  }

  if(activeTab === "sql"){
    const firstWord = line.split(/\s+/)[0] || "This SQL line";
    return `${firstWord} is part of the query. Read it from top to bottom: choose data, choose where it comes from, then filter, group, or sort it depending on the topic.`;
  }

  return `This line is one small instruction in the program. Read it slowly from left to right, identify the values or names, then run the code to see how this topic changes the output.`;
}

function renderCommandDetails(topic){
  const lines = exampleLines(topic.code);

  if(!lines.length){

  return `

      <p>This topic includes the commands below with a concise explanation for each line.</p>

          <p>${escapeHtml(explainExampleLine(topic, line))}</p>
        </div>
      `).join("")}
    </div>
  `;
}

      }, 1400);
    });
  });
}

function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text);
    return;
  }

  const textarea = document.createElement("textarea");
  textarea.value = text;
  textarea.style.position = "fixed";
  textarea.style.left = "-9999px";
  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();
  document.execCommand("copy");
  textarea.remove();
}

function updateSidebarActive(topicId){

      const group = link.closest(".topic-group");
      const icon = group.querySelector(".topic-head i");
      group.classList.add("open");
      icon.classList.add("fa-chevron-up");
      icon.classList.remove("fa-chevron-down");
    }
  });
}

  document.querySelectorAll(".topic-nav-btn").forEach(button => {
    button.addEventListener("click", () => {
      if(button.disabled || !button.dataset.topicId){
        return;
      }

      selectTopic(button.dataset.topicId);
    });
  });
}

function wireCommandTabs(){
  document.querySelectorAll(".cmd-tab-button").forEach(button => {
    button.addEventListener("click", () => {
      const commandId = button.dataset.commandId;
      const container = button.closest(".content-section");

      if(!container){
        return;
      }

      container.querySelectorAll(".cmd-tab-button").forEach(tab => tab.classList.remove("active"));
      container.querySelectorAll(".cmd-details").forEach(panel => panel.classList.remove("active"));

      button.classList.add("active");
      const activePanel = container.querySelector(`.cmd-details[data-command-id="${commandId}"]`);
      if(activePanel){
        activePanel.classList.add("active");
      }
    });
  });
}

function selectTopic(topicId, options = {}){
  const topic = currentTopics.find(item => item.id === topicId);

  if(!topic){
    return;
  }

  activeTopicId = topic.id;
  content.innerHTML = renderTopic(topic);
  emptyState.style.display = "none";
  updateSidebarActive(activeTopicId);
  wireCopyButtons();
  wireTopicNavButtons();
  wireCommandTabs();

  if(window.hljs){
    hljs.highlightAll();
  }

  if(options.scroll !== false){
    content.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  }
}

function renderTab(tabName){
  const doc = docs[tabName];
  activeTab = tabName;
  currentTopics = getAllTopics(doc);
  activeTopicId = currentTopics[0]?.id || "";

  sidebarTitle.textContent = `${doc.label} Topics`;
  heroTitle.textContent = `Ultimate ${doc.label} Documentation Portal`;
  heroText.textContent = doc.description;
  searchBox.value = "";
  searchBox.placeholder = `Search ${doc.label} topics...`;
  searchResults.style.display = "none";
  emptyState.style.display = "none";

  renderSidebar(doc);
  wireSidebarGroups();
  selectTopic(activeTopicId, {scroll:false});
}

function clearSearchResults(){
  searchResults.innerHTML = "";
  searchResults.style.display = "none";
  emptyState.style.display = "none";
}

function showSearchResults(matches){
  if(!matches.length){
    searchResults.innerHTML = `
      <div class="search-item">
        <h4>No matching topics found</h4>
        <p>Try another keyword in the current tab.</p>
      </div>
    `;
    searchResults.style.display = "block";
    emptyState.style.display = "none";
    return;
  }

  searchResults.innerHTML = matches.map(topic => `
    <div class="search-item" data-target="${escapeHtml(topic.id)}">
      <h4>${escapeHtml(topicLabel(topic))}</h4>
      <p>${escapeHtml(topic.levelTitle)} | Click to navigate instantly</p>
    </div>
  `).join("");

  searchResults.style.display = "block";
  emptyState.style.display = "none";

  document.querySelectorAll(".search-item").forEach(item => {
    item.addEventListener("click", () => {
      selectTopic(item.dataset.target);
      clearSearchResults();
      searchBox.value = "";
    });
  });
}

function searchTopics(){
  const value = searchBox.value.trim().toLowerCase();

  if(!value){
    clearSearchResults();
    return;
  }

  const matches = currentTopics.filter(topic => {
    const searchableText = `${topic.title} ${topic.body} ${topic.levelTitle} ${topic.code || ""}`;
    return searchableText.toLowerCase().includes(value);
  });

  showSearchResults(matches);
}

menuBtn.addEventListener("click", () => {
  sidebar.classList.toggle("hide");
});

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(item => item.classList.remove("active"));
    tab.classList.add("active");
    languageTabs.prepend(tab);
    renderTab(tab.dataset.tab);
  });
});

searchBox.addEventListener("input", searchTopics);

document.addEventListener("click", event => {
  if(!event.target.closest(".search-area")){
    searchResults.style.display = "none";
  }
});

renderTab(activeTab);
</script>
</body>
</html>
